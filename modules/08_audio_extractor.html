<style>
    .module-extractor {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    .extract-dropzone {
        width: 100%;
        flex: 1;
        border: 2px dashed rgba(0, 240, 255, 0.4);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }

    .extract-dropzone:hover, .extract-dropzone.dragover {
        border-color: var(--neon-cyan);
        background: rgba(0, 240, 255, 0.05);
        box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1);
    }

    .extract-icon {
        font-size: 2rem;
        margin-bottom: 10px;
        filter: drop-shadow(0 0 8px var(--neon-cyan));
    }

    .extract-text {
        color: var(--text-main);
        font-family: monospace;
        font-size: 0.9rem;
        text-align: center;
        pointer-events: none;
    }

    .extract-subtext {
        color: var(--text-muted);
        font-size: 0.75rem;
        margin-top: 5px;
        pointer-events: none;
    }

    #mp4-file-input {
        display: none;
    }

    /* 扫描光效 */
    .scan-overlay {
        position: absolute;
        top: -100%;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.4), transparent);
        transition: top 0.1s linear;
        pointer-events: none;
        display: none;
    }

    .extract-dropzone.processing .scan-overlay {
        display: block;
        animation: scan-down 1.5s linear infinite;
    }

    @keyframes scan-down {
        0% { top: -100%; }
        100% { top: 100%; }
    }
</style>

<div class="bento-item span-2x2 hover-cyan">
    <div class="module-extractor">
        <h3 style="color: var(--neon-cyan); font-size: 1.1rem; margin-bottom: 15px; width: 100%; text-align: left;">
            🎛️ MEDIA_DECODER [MP4->WAV]
        </h3>
        
        <label class="extract-dropzone" id="dropzone-11">
            <div class="scan-overlay"></div>
            <div class="extract-icon">🎞️ ⚡ 🎵</div>
            <div class="extract-text" id="status-text-11">点击或拖拽 MP4 文件至此</div>
            <div class="extract-subtext" id="substatus-text-11">纯本地计算 / 零依赖 / 无损导出</div>
            <input type="file" id="mp4-file-input" accept="video/mp4,video/*">
        </label>
    </div>

    <script>
        (function() {
            const dropzone = document.getElementById('dropzone-11');
            const fileInput = document.getElementById('mp4-file-input');
            const statusText = document.getElementById('status-text-11');
            const substatusText = document.getElementById('substatus-text-11');
            let isProcessing = false;

            // 拖拽事件处理
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });
            dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
                if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
            });

            // 点击选择文件处理
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) processFile(e.target.files[0]);
                // 重置 input，允许重复选择同一个文件
                e.target.value = ''; 
            });

            async function processFile(file) {
                if (isProcessing) return;
                if (!file.type.startsWith('video/')) {
                    alert("错误：请上传视频文件！");
                    return;
                }

                isProcessing = true;
                dropzone.classList.add('processing');
                statusText.innerText = `[1/3] 读取文件: ${file.name}...`;
                substatusText.innerText = "正在将视频加载至内存阵列";

                try {
                    // 1. 读取文件
                    const arrayBuffer = await file.arrayBuffer();
                    
                    statusText.innerText = "[2/3] 分离音轨...";
                    substatusText.innerText = "解码媒体块中，请稍候 (由浏览器核心计算)";
                    
                    // 2. 解码音频数据
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    
                    statusText.innerText = "[3/3] 封装 WAV 格式...";
                    substatusText.innerText = "生成无损音频波形";

                    // 3. 转换为 WAV (纯原生算法)
                    const wavBlob = audioBufferToWav(audioBuffer);
                    
                    // 4. 触发下载
                    const url = URL.createObjectURL(wavBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    // 将文件名后缀改为 .wav
                    a.download = file.name.replace(/\.[^/.]+$/, "") + "_extracted.wav"; 
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    statusText.innerText = "✅ 提取成功！";
                    substatusText.innerText = "点击或拖拽 MP4 继续提取";
                } catch (error) {
                    console.error("音频提取失败:", error);
                    statusText.innerText = "❌ 提取失败";
                    substatusText.innerText = "该视频格式可能不受浏览器原生支持";
                } finally {
                    isProcessing = false;
                    dropzone.classList.remove('processing');
                    setTimeout(() => {
                        if(!isProcessing) {
                            statusText.innerText = "点击或拖拽 MP4 文件至此";
                            substatusText.innerText = "纯本地计算 / 零依赖 / 无损导出";
                        }
                    }, 3000);
                }
            }

            // 纯原生 JS 实现的 AudioBuffer 转 WAV 算法
            function audioBufferToWav(buffer) {
                const numOfChan = buffer.numberOfChannels;
                const length = buffer.length * numOfChan * 2 + 44;
                const bufferArray = new ArrayBuffer(length);
                const view = new DataView(bufferArray);
                const channels = [];
                let offset = 0, pos = 0;

                // 写入 WAV 头部 (RIFF)
                function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
                function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

                setUint32(0x46464952); // "RIFF"
                setUint32(length - 8); // file length - 8
                setUint32(0x45564157); // "WAVE"
                setUint32(0x20746d66); // "fmt " chunk
                setUint32(16); // length = 16
                setUint16(1); // PCM (uncompressed)
                setUint16(numOfChan);
                setUint32(buffer.sampleRate);
                setUint32(buffer.sampleRate * 2 * numOfChan); // avg. bytes/sec
                setUint16(numOfChan * 2); // block-align
                setUint16(16); // 16-bit
                setUint32(0x61746164); // "data" - chunk
                setUint32(length - pos - 4); // chunk length

                for (let i = 0; i < buffer.numberOfChannels; i++) {
                    channels.push(buffer.getChannelData(i));
                }

                // 写入 PCM 采样数据
                while (pos < length) {
                    for (let i = 0; i < numOfChan; i++) {
                        let sample = Math.max(-1, Math.min(1, channels[i][offset])); // clamp
                        sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0; // scale to 16-bit
                        view.setInt16(pos, sample, true);
                        pos += 2;
                    }
                    offset++;
                }
                return new Blob([bufferArray], { type: "audio/wav" });
            }
        })();
    </script>
</div>
