<div class="bento-item span-2x2 hover-purple" style="display: flex; flex-direction: column; padding: 15px; position: relative; overflow: hidden; box-sizing: border-box; background-color: var(--box-bg);">
    <style>
        .cyber-calendar {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: monospace;
        }
        .cyber-cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--neon-purple);
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(188, 19, 254, 0.3);
            padding-bottom: 8px;
            text-shadow: 0 0 5px rgba(188, 19, 254, 0.4);
        }
        .cyber-cal-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 2px;
            transition: all 0.2s ease;
            font-family: monospace;
            outline: none;
        }
        .cyber-cal-btn:hover {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            box-shadow: 0 0 8px rgba(188, 19, 254, 0.5);
            background: rgba(188, 19, 254, 0.1);
        }
        .cyber-cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            flex-grow: 1;
            text-align: center;
        }
        .cyber-cal-day-name {
            color: var(--text-muted);
            font-size: 0.75rem;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }
        .cyber-cal-date {
            color: var(--text-main);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            border-radius: 2px;
            transition: border 0.2s, color 0.2s, background 0.2s;
            aspect-ratio: 1 / 1;
        }
        .cyber-cal-date.today {
            color: var(--bg-color);
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .cyber-cal-date.active-hover:hover {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            background: rgba(188, 19, 254, 0.1);
            cursor: crosshair;
        }
        .cyber-cal-date.empty {
            pointer-events: none;
        }
    </style>

    <div class="cyber-calendar" id="cyber-calendar-app">
        <div class="cyber-cal-header">
            <button class="cyber-cal-btn" id="cyber-cal-prev">◀</button>
            <span id="cyber-cal-month-year">SYS.DATE</span>
            <button class="cyber-cal-btn" id="cyber-cal-next">▶</button>
        </div>
        <div class="cyber-cal-grid" id="cyber-cal-days-header">
            <div class="cyber-cal-day-name">SUN</div>
            <div class="cyber-cal-day-name">MON</div>
            <div class="cyber-cal-day-name">TUE</div>
            <div class="cyber-cal-day-name">WED</div>
            <div class="cyber-cal-day-name">THU</div>
            <div class="cyber-cal-day-name">FRI</div>
            <div class="cyber-cal-day-name">SAT</div>
        </div>
        <div class="cyber-cal-grid" id="cyber-cal-dates">
            </div>
    </div>

    <script>
        (function() {
            const monthYearEl = document.getElementById('cyber-cal-month-year');
            const datesEl = document.getElementById('cyber-cal-dates');
            const prevBtn = document.getElementById('cyber-cal-prev');
            const nextBtn = document.getElementById('cyber-cal-next');

            let currentDate = new Date(); 
            const today = new Date(); 

            function renderCalendar() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                // 格式化时间显示 (例如: 2077 / 08)
                const monthNames = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];
                monthYearEl.textContent = `${year} / ${monthNames[month]}`;

                // 清除缓存数据
                datesEl.innerHTML = '';

                const firstDayOfMonth = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                // 填充上个月的留白
                for (let i = 0; i < firstDayOfMonth; i++) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'cyber-cal-date empty';
                    datesEl.appendChild(emptyDiv);
                }

                // 生成当前月的矩阵
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'cyber-cal-date active-hover';
                    dateDiv.textContent = i;

                    // 高亮系统当前真实时间 (赛博青色)
                    if (year === today.getFullYear() && 
                        month === today.getMonth() && 
                        i === today.getDate()) {
                        dateDiv.classList.add('today');
                        dateDiv.classList.remove('active-hover'); // 当前日期禁用普通悬浮效果
                    }

                    datesEl.appendChild(dateDiv);
                }
            }

            // 绑定数据流切换事件
            prevBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            nextBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            // 初始化装载
            renderCalendar();
        })();
    </script>
</div>
