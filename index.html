<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的数字名片 | Bento Box</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --box-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff003c;
            --neon-purple: #bc13fe;
        }
        body {
            margin: 0;
            padding: 2rem;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 150px;
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
        }
        .bento-item {
            background-color: var(--box-bg);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            text-decoration: none;
            color: inherit;
        }
        
        /* 霓虹灯悬停发光动画 */
        .bento-item:hover {
            transform: translateY(-5px);
            z-index: 10;
        }
        .hover-cyan:hover {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.1);
            border-color: var(--neon-cyan);
        }
        .hover-pink:hover {
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.4), inset 0 0 10px rgba(255, 0, 60, 0.1);
            border-color: var(--neon-pink);
        }
        .hover-purple:hover {
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.4), inset 0 0 10px rgba(188, 19, 254, 0.1);
            border-color: var(--neon-purple);
        }

        /* 网格跨度控制（拼图模块大小） */
        .span-2x2 { grid-column: span 2; grid-row: span 2; }
        .span-2x1 { grid-column: span 2; grid-row: span 1; }
        .span-1x2 { grid-column: span 1; grid-row: span 2; }

        /* 内容排版 */
        h1, h2, h3 { margin: 0 0 0.5rem 0; letter-spacing: 1px;}
        p { margin: 0; color: var(--text-muted); font-size: 0.9rem;}
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple)); margin-bottom: 1rem; }
        
        /* 响应式设计：手机端自动变成单列 */
        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: auto;
            }
            .span-2x2, .span-2x1, .span-1x2 {
                grid-column: span 1;
                grid-row: span 1;
                min-height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="bento-grid">
        <div class="bento-item span-2x2 hover-cyan">
            <div class="avatar"></div>
            <h2>你好，我是 极客</h2>
            <p>Python 开发者 / 终身学习者</p>
            <p style="margin-top: 1.5rem; font-style: italic;">"Talk is cheap. Show me the code."</p>
        </div>

        <a href="https://github.com/你的用户名" target="_blank" class="bento-item span-2x1 hover-purple">
            <h3>🐙 GitHub</h3>
            <p>查看我的开源代码与提交图谱</p>
        </a>

        <div class="bento-item span-1x2 hover-pink">
            <h3>🛠️ 技能栈</h3>
            <p style="margin-top: 10px; line-height: 2;">
                Python<br>HTML/CSS<br>Git & GitHub<br>SQL
            </p>
        </div>

        <a href="#" class="bento-item hover-cyan">
            <h3>🎵 正在听</h3>
            <p>Cyberpunk OST</p>
        </a>

        <a href="#" class="bento-item hover-pink">
            <h3>📝 博客</h3>
            <p>技术踩坑记录</p>
        </a>

        <div class="bento-item span-2x1 hover-purple">
            <h3>✉️ 联系我</h3>
            <p>hello@yourdomain.com</p>
        </div>
    </div>
</body>
</html>
